# Exemplo de config.cfg
# Cada seção começa com [tipo] e os parâmetros nas linhas seguintes

# Executa um arquivo .bat (pode ter espaços no nome)
[run]
File.bat

# Executa um script PowerShell
[run]
Setup.ps1

# Executa um executável
[run]
Installer.exe

# Copia arquivos para um destino
[copy]
Arquivo1.exe, Arquivo2.dll, Config.ini
to
C:\Program Files\MeuApp

# Move arquivos para um destino
[move]
Logs.txt, Backup.dat
to
%USERPROFILE%\Documents\Backup

# Deleta arquivos do pacote após instalação
[delete]
Temp.bat, Instalador.exe

# Importa arquivos .reg
[regedit]
Settings.reg, Paths.reg